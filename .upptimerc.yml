owner: MinecraftAuthentication
repo: status

sites:
  - name: Site
    url: https://minecraftauth.me/
  - name: API
    url: https://minecraftauth.me/api/lookup
    expectedStatusCodes:
      - 400
    __dangerous__body_down_if_text_missing: "No identifier given"
  - name: Minecraft
    check: "tcp-ping"
    url: mc.minecraftauth.me
    port: 26552
  - name: Mojang Login
    url: https://sessionserver.mojang.com/session/minecraft/hasJoined
    expectedStatusCodes:
      - 204
  - name: Discord API
    url: https://discord.com/api/users/@me
    expectedStatusCodes:
      - 401
  - name: Patreon API
    url: https://www.patreon.com/api/oauth2/v2/campaigns/0/members
    expectedStatusCodes:
      - 401
  - name: Twitch Subscriptions API
    url: https://api.twitch.tv/helix/subscriptions
    expectedStatusCodes:
      - 401
  - name: YouTube Channels API
    url: https://www.googleapis.com/youtube/v3/channels
    expectedStatusCodes:
      - 403

status-website:
  cname: status.minecraftauth.me
  logoUrl: https://minecraftauth.me/favicon.png
  theme: night
  name: Minecraft Authentication Status
  navbar:
    - title: Home
      href: https://minecraftauth.me
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER
